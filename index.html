<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<meta name="description" content="WISP — a tiny light that grows with you. Name it, feed it light, build it a world. A cozy idle game that never truly ends.">
<meta property="og:title" content="WISP — a tiny light that grows with you">
<meta property="og:description" content="Name a little light. Feed it by touch. Build it a living meadow. Raise it into a star that watches over everything that comes after.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>WISP — a tiny light that grows with you</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g'><stop offset='0%25' stop-color='%23fff7d6'/><stop offset='55%25' stop-color='%23ffd97a'/><stop offset='100%25' stop-color='%23ffb84d' stop-opacity='0'/></radialGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════ WORLD ══════════════ -->
<canvas id="world"></canvas>
<div id="vignette"></div>

<!-- ══════════════ HUD ══════════════ -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div id="counter">
      <div id="light-amount">0</div>
      <div id="light-rate">0 /s</div>
    </div>
    <div id="wisp-plate">
      <div id="wisp-name-tag">Wisp</div>
      <div id="wisp-stage-tag">Mote</div>
      <div id="xpbar"><div id="xpfill"></div></div>
      <div id="wisp-level-tag">Lv 1</div>
    </div>
    <div id="top-actions">
      <button id="btn-photo" class="icon-btn" title="Take a postcard photo" aria-label="Take a postcard photo">📷</button>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>

  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <!-- ══════════════ PANEL ══════════════ -->
  <div id="panel" class="collapsed">
    <button id="panel-toggle" aria-label="Toggle panel"><span id="panel-toggle-arrow">▲</span></button>
    <nav id="tabs">
      <button class="tab active" data-tab="build">Build</button>
      <button class="tab" data-tab="boosts">Boosts</button>
      <button class="tab" data-tab="wisp">Wisp</button>
    </nav>
    <div id="tab-content">
      <div id="tab-build" class="tab-page active"></div>
      <div id="tab-boosts" class="tab-page"></div>
      <div id="tab-wisp" class="tab-page"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="floaters"></div>
</div>

<!-- ══════════════ INTRO ══════════════ -->
<div id="intro">
  <div id="intro-star"></div>
  <div id="intro-text-wrap">
    <p id="intro-line" class="intro-line"></p>
    <div id="name-form" class="hidden">
      <input id="name-input" type="text" maxlength="14" placeholder="give it a name…" autocomplete="off" spellcheck="false">
      <button id="name-ok">✦</button>
    </div>
  </div>
  <p id="intro-skip">tap to continue</p>
</div>

<!-- ══════════════ MODALS ══════════════ -->
<div id="modal-shade" class="hidden">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/particles.js"></script>
<script src="js/scene.js"></script>
<script src="js/wisp.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
