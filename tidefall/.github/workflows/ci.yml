name: CI

# Every push proves the game still compiles, passes its tests, and
# builds. Deployment is handled by the connected host (Cloudflare
# Pages / Netlify / Vercel), which builds from this same repo.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Balance simulation self-checks
        run: npm run sim

      # The checks above never render a frame. This one opens the built
      # bundle in a real browser, which is the only way to catch things
      # like a render pipe that registers too late to be picked up.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test the production build
        run: npm run test:smoke
