<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="TIDEFALL — fish, chop, mine, hunt, and build your island holding. A cozy idle RPG.">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>TIDEFALL</title>
</head>
<body>

<!-- The game canvas lives here; viewport.ts owns its size. -->
<div id="stage-frame">
  <canvas id="stage"></canvas>
  <!-- DOM UI overlay: crisp text, real accessibility, safe-area aware -->
  <div id="ui-root"></div>
</div>

<!-- Landscape guard: this game is portrait-only by design. -->
<div id="rotate-guard" hidden>
  <div class="rotate-inner">
    <div class="rotate-icon" aria-hidden="true"></div>
    <p class="rotate-title">Turn your device</p>
    <p class="rotate-sub">TIDEFALL is played in portrait.</p>
  </div>
</div>

<!-- First-paint splash, removed once the first real frame lands. -->
<div id="boot-splash">
  <div class="boot-mark">TIDEFALL</div>
  <div class="boot-bar"><span id="boot-fill"></span></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
