<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>TIDEFALL — UI harness</title>
</head>
<body>

<!-- Mirrors index.html exactly so the UI is reviewed in its real
     container: same portrait frame, same #ui-root, same z-order. The
     real game boots underneath via main.ts, untouched. -->
<div id="stage-frame">
  <canvas id="stage"></canvas>
  <div id="ui-root"></div>
</div>

<div id="rotate-guard" hidden>
  <div class="rotate-inner">
    <div class="rotate-icon" aria-hidden="true"></div>
    <p class="rotate-title">Turn your device</p>
    <p class="rotate-sub">TIDEFALL is played in portrait.</p>
  </div>
</div>

<div id="boot-splash">
  <div class="boot-mark">TIDEFALL</div>
  <div class="boot-bar"><span id="boot-fill"></span></div>
</div>

<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/ui/dev-harness.ts"></script>
</body>
</html>
